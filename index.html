<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Infinito Inmobiliario</title>
  <meta name="description" content="Próximamente: Infinito Inmobiliario.">
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #fff; color: #1a1a1a; }
    main { width: min(100% - 3rem, 56rem); border-top: 1px solid #1a1a1a; padding: 2rem 0 5rem; }
    p { font-size: 1rem; line-height: 1.5; color: #555; }
    h1 { margin: 6rem 0 1rem; font-size: clamp(3rem, 10vw, 7rem); line-height: .98; font-weight: 500; letter-spacing: -.06em; }
    .eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .875rem; color: #1a1a1a; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Infinito Inmobiliario</p>
    <h1>Un nuevo espacio para encontrar tu lugar.</h1>
    <p>Estamos preparando este sitio.</p>
  </main>
</body>
</html>
